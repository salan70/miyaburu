name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: 開発ツールの確認
        run: nix develop --command just versions
      - name: RustとDocBridgeを検証
        run: nix develop --command just check
