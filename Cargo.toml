[package]
name = "miyaburu"
version = "0.1.0"
edition = "2024"
description = "Markdownを見やすくブラウザーで表示するRust製CLI"
repository = "https://github.com/salan70/miyaburu"

[dependencies]
fs2 = "0.4"
libc = "0.2"
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
# 正規表現はRustだけで動く fancy-regex にして、Cのライブラリ（Oniguruma）を持ち込まない。
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
toml = "1"
# syntect の既定にない言語（TypeScript、TOML、Swift、Kotlin、Dart など）の構文定義。
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
